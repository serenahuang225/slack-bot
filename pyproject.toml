[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evercurrent-digest"
version = "0.1.0"
description = "A personalized Slack digest and thread-grounded assistant"
requires-python = ">=3.11"
dependencies = ["slack-bolt>=1.21,<2", "SQLAlchemy>=2.0,<3", "python-dotenv>=1,<2", "google-genai>=1,<2", "APScheduler>=3.10,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "requests>=2.32,<3", "sqlite-vec>=0.1.6,<0.2", "pgvector>=0.4,<0.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
digest = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
